<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadRadar</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-light: #242836;
      --border: #2e3347;
      --text: #e8eaf0;
      --text-muted: #8b91a7;
      --accent: #6c5ce7;
      --accent-hover: #7d6df0;
      --success: #00cec9;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="number"] {
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
    }

    .criteria-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .checkbox-item:hover {
      border-color: var(--accent);
    }

    .checkbox-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .checkbox-item span {
      font-size: 0.85rem;
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .scan-id {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: var(--surface-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
    }

    .results-table th,
    .results-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .results-table th {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .results-table td {
      font-size: 0.9rem;
      vertical-align: top;
    }

    .results-table tr:last-child td {
      border-bottom: none;
    }

    .results-table tr:hover td {
      background: var(--surface-light);
    }

    .signal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-email {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-email:hover {
      background: rgba(108, 92, 231, 0.1);
    }

    .email-reveal {
      margin-top: 8px;
      padding: 12px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: pre-wrap;
      display: none;
    }

    .email-reveal.visible {
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LeadRadar</h1>
      <p>Find businesses that need your services</p>
    </header>

    <div class="card">
      <form id="scan-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="service">Service</label>
            <input type="text" id="service" name="service" placeholder="e.g. Web Development" required>
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. Austin, TX" required>
          </div>
          <div class="form-group">
            <label for="maxLeads">Max Leads</label>
            <input type="number" id="maxLeads" name="maxLeads" value="10" min="1" max="100" required>
          </div>
          <div class="form-group">
            <label for="senderName">Your Name</label>
            <input type="text" id="senderName" name="senderName" placeholder="e.g. Alex" required>
          </div>
        </div>

        <div class="criteria-group">
          <label class="checkbox-item">
            <input type="checkbox" name="criteria" value="noWebsite">
            <span>No Website</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="criteria" value="outdatedWebsite">
            <span>Outdated Website</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="criteria" value="noGoogleBusiness">
            <span>No Google Business</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="criteria" value="badReviewsNoResponse">
            <span>Bad Reviews, No Response</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          Start Scan
        </button>
      </form>
    </div>

    <div class="card hidden" id="status-card">
      <div class="status-bar">
        <div class="spinner" id="spinner"></div>
        <span id="status-text">Scanning for leads...</span>
        <span class="scan-id" id="scan-id-display"></span>
      </div>
    </div>

    <div class="card hidden" id="results-card">
      <table class="results-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Address</th>
            <th>Rating</th>
            <th>Score</th>
            <th>Signals</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody id="results-body">
        </tbody>
      </table>
      <div class="empty-state hidden" id="empty-results">
        No leads found matching your criteria.
      </div>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('scan-form');
      const submitBtn = document.getElementById('submit-btn');
      const statusCard = document.getElementById('status-card');
      const statusText = document.getElementById('status-text');
      const spinner = document.getElementById('spinner');
      const scanIdDisplay = document.getElementById('scan-id-display');
      const resultsCard = document.getElementById('results-card');
      const resultsBody = document.getElementById('results-body');
      const emptyResults = document.getElementById('empty-results');

      let pollInterval = null;
      let currentScanId = null;

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const service = document.getElementById('service').value.trim();
        const location = document.getElementById('location').value.trim();
        const maxLeads = parseInt(document.getElementById('maxLeads').value, 10);
        const senderName = document.getElementById('senderName').value.trim();

        const criteria = Array.from(
          document.querySelectorAll('input[name="criteria"]:checked')
        ).map(cb => cb.value);

        submitBtn.disabled = true;
        submitBtn.textContent = 'Starting scan...';

        try {
          const response = await fetch('/api/scans', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ service, location, maxLeads, criteria, senderName })
          });

          if (!response.ok) throw new Error('Failed to create scan');

          const data = await response.json();
          currentScanId = data.scanId;

          scanIdDisplay.textContent = currentScanId;
          statusCard.classList.remove('hidden');
          resultsCard.classList.remove('hidden');
          resultsBody.innerHTML = '';
          emptyResults.classList.add('hidden');
          spinner.style.display = 'block';
          statusText.textContent = 'Scanning for leads...';
          submitBtn.textContent = 'Scanning...';

          startPolling(currentScanId);
        } catch (err) {
          alert('Failed to start scan: ' + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Start Scan';
        }
      });

      function startPolling(scanId) {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(() => pollScan(scanId), 3000);
        pollScan(scanId);
      }

      async function pollScan(scanId) {
        try {
          const response = await fetch('/api/scans/' + scanId);
          if (!response.ok) return;

          const data = await response.json();

          const labels = {
            pending: 'Starting scan...',
            scanning: 'Finding local businesses...',
            classifying: 'Reading each business...',
            drafting: 'Writing outreach emails...'
          };

          if (data.status === 'complete') {
            spinner.style.display = 'none';
            statusText.textContent = 'Scan complete! ' + (data.leads || []).length + ' leads found.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'New Scan';
            clearInterval(pollInterval);
            renderResults(data.leads || []);
          } else if (data.status === 'failed') {
            spinner.style.display = 'none';
            statusText.textContent = 'Scan failed.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Try Again';
            clearInterval(pollInterval);
          } else if (labels[data.status]) {
            statusText.textContent = labels[data.status];
          }
        } catch (err) {
          // Silent retry on network errors
        }
      }

      function renderResults(leads) {
        resultsBody.innerHTML = '';

        if (leads.length === 0) {
          emptyResults.classList.remove('hidden');
          return;
        }

        emptyResults.classList.add('hidden');

        leads.forEach(function(lead) {
          const tr = document.createElement('tr');

          const signals = (lead.signals || []).map(function(s) {
            return '<span class="tag">' + escapeHtml(s.description || s.type || '') + '</span>';
          }).join('');

          tr.innerHTML =
            '<td>' + escapeHtml(lead.name) + '</td>' +
            '<td>' + escapeHtml(lead.address) + '</td>' +
            '<td>' + (lead.rating != null ? lead.rating : '—') + '</td>' +
            '<td>' + (lead.score != null ? lead.score : '—') + '</td>' +
            '<td><div class="signal-tags">' + signals + '</div></td>' +
            '<td>' +
              '<button class="btn-email" data-email="' + escapeHtml(lead.outreachEmail || '') + '">Show Email</button>' +
              '<div class="email-reveal">' + escapeHtml(lead.outreachEmail || '') + '</div>' +
            '</td>';

          resultsBody.appendChild(tr);
        });

        resultsBody.querySelectorAll('.btn-email').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const reveal = this.parentElement.querySelector('.email-reveal');
            reveal.classList.toggle('visible');
            this.textContent = reveal.classList.contains('visible') ? 'Hide Email' : 'Show Email';
          });
        });
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
