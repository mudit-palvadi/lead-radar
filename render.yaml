# LeadRadar runs as one web service: the API and the Temporal worker in the
# same process. Render's free compute plan supports web services but rejects
# background workers, so scripts/start-all.js runs both.
services:
  - type: web
    name: leadradar
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node scripts/start-all.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: allam-2-7b
      - key: SERPAPI_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
